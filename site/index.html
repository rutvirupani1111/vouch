<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vouch Trust Index</title>
    <meta name="description" content="The Vouch Trust Index scores popular npm packages on what they can do, whether the published tarball matches its source, and how much you should trust them." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/vouch/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('vouch-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
